name: Verify and publish course
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python labs/build_notebooks.py 47
      - run: python scripts/verify_course.py
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python scripts/check_mobile.py docs/_build/html --include-static
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy course website
        id: deployment
        uses: actions/deploy-pages@v4
